<div class="upload-dropdown-container">

    <button class="btn-upload-trigger" id="uploadTriggerBtn" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Tambah Baru</span>
    </button>

    <div class="upload-menu" id="uploadMenu" role="menu" hidden>
        <ul class="upload-menu__list">

            <li role="none">
                <button class="upload-menu__item" role="menuitem" data-action="upload-file">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48">
                        </path>
                    </svg>
                    Upload file
                </button>
            </li>

            <li role="none">
                <button class="upload-menu__item" role="menuitem" data-action="add-drive">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 22h20L12 2z"></path>
                        <path d="M12 2L2 22"></path>
                        <path d="M22 22L12 2"></path>
                    </svg>
                    Add from Drive
                </button>
            </li>

            <li role="none">
                <button class="upload-menu__item" role="menuitem" data-action="photos">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    Photos
                </button>
            </li>

            <li role="none">
                <button class="upload-menu__item" role="menuitem" data-action="website">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"></path>
                    </svg>
                    Website
                </button>
            </li>

            <li role="none">
                <button class="upload-menu__item" role="menuitem" data-action="copied-text">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    Copied text
                </button>
            </li>

        </ul>
    </div>
</div>
